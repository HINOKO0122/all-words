<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バベルの国語辞典</br>(The Vocabulary Book of Babel)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f6f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .search-box { position: sticky; top: 0; background: #f4f6f9; padding: 15px 0; border-bottom: 2px solid #e2e8f0; z-index: 100; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { padding: 12px 20px; font-size: 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .word-list { margin-top: 20px; }
        .word-item { padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid #cbd5e1; }
        .word-item.highlight { background: #eff6ff; border-left-color: #3b82f6; }
        .no { font-weight: bold; color: #3b82f6; font-size: 14px; word-break: break-all; }
        .word { font-size: 24px; display: block; margin: 8px 0; font-weight: bold; letter-spacing: 1px; word-break: break-all; }
        .btn-dict { display: inline-block; margin-top: 8px; padding: 6px 12px; font-size: 12px; background: #10b981; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-dict:hover { background: #059669; }
    </style>
</head>
<body>

    <h1>📚 バベルの国語辞典(The Vocabulary Book of Babel)</h1>
    <div class="subtitle">ひらがなの全ての組み合わせを網羅したアーカイブ</br>全ての単語がこの辞典に載っている</br></br>あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎー</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="単語（例: ばななす）または 番号（例: 34327755）を入力" onkeydown="if(event.key === 'Enter') searchWord()">
    <button onclick="searchWord()">検索</button>
    </div>

    <div id="targetWordArea"></div>
    <h2 style="font-size: 18px; color: #475569; margin-top: 30px;">辞典一覧</h2>
    <div class="word-list" id="wordList"></div>

    <script>
        const CHARS = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎー";
        const BASE = BigInt(CHARS.length);

        let currentLoadedCount = 0;
        const LOAD_CHUNK = 50; 
        const maxDisplayCount = 10**100; 

        // ナンバーから単語を作る
        function getWordFromNo(no) {
            let n = BigInt(no) - 1n;
            let word = "";
            let len = 1n;
            let range = BASE;

            while (n >= range) {
                n -= range;
                len++;
                range *= BASE;
            }

            for (let i = 0; i < len; i++) {
                word = CHARS[Number(n % BASE)] + word;
                n /= BASE;
            }
            return word;
        }

        // 単語からナンバーを作る
        function getNoFromWord(word) {
            let no = 0n;
            let len = BigInt(word.length);
            let range = 1n;

            for (let i = 1n; i < len; i++) {
                range *= BASE;
                no += range;
            }

            let current = 0n;
            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                const index = CHARS.indexOf(char);
                if (index === -1) return -1n;
                current = current * BASE + BigInt(index);
            }
            return no + current + 1n;
        }

        // 一覧表示（無限スクロール）
        function loadMoreWords() {
    if (currentLoadedCount >= maxDisplayCount) return;

    const listContainer = document.getElementById("wordList");
    let html = "";
    
    const start = currentLoadedCount + 1;
    const end = Math.min(maxDisplayCount, currentLoadedCount + LOAD_CHUNK);

    for (let i = start; i <= end; i++) {
        const word = getWordFromNo(i);
        html += `
            <div class="word-item" id="word-${word}">
                <span class="no">No.${i}</span>
                <span class="word">${word}</span>
            </div>
        `;
    }
    
    listContainer.insertAdjacentHTML('beforeend', html);
    currentLoadedCount = end;
}

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                loadMoreWords();
            }
        });

        // 検索＆ワープ処理
        function searchWord() {
            const input = document.getElementById("searchInput").value.trim();
            if (!input) return;

            let no = 0n;
            let word = "";

            // 数字か文字かを判定
            if (/^\d+$/.test(input)) {
                // 数字（No）で検索された場合
                no = BigInt(input);
                word = getWordFromNo(no);
            } else {
                // 文字（単語）で検索された場合
                word = input;
                no = getNoFromWord(word);
                if (no === -1n) {
                    alert("辞典に含まれない文字（漢字、カタカナ、アルファベット等）が含まれています。ひらがな・濁音・半濁音・小文字・ー のみで入力してください。");
                    return;
                }
            }

            const targetArea = document.getElementById("targetWordArea");
            targetArea.innerHTML = `
    <h2 style="font-size: 18px; color: #3b82f6; margin-top: 20px;">🔍 検索結果</h2>
    <div class="word-item highlight">
        <span class="no">No.${no}</span>
        <span class="word">${word}</span>
        
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 15px;">
            <a class="btn-dict" href="https://www.google.com/search?q=${encodeURIComponent(word)}+意味" target="_blank" style="margin-top:0;">🔍 Googleで意味を調べる</a>
        </div>
        
        <!-- 自動表示される画像エリア -->
        <div id="imageResultArea" style="text-align: center; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1;">
            <canvas id="wordCanvas" width="600" height="315" style="display:none;"></canvas>
            <img id="outputImage" src="" alt="生成画像" style="max-width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <!-- ✨ 追加：ファイル名を指定してダウンロードできる専用ボタン -->
            <div style="margin-top: 15px; margin-bottom: 15px;">
                <a id="btnDownload" href="#" download="" style="display: inline-block; padding: 10px 20px; font-size: 14px; background: #10b981; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">📥 画像を保存する</a>
            </div>
            
            <p style="font-size: 12px; color: #64748b; margin: 0 0 15px; line-height: 1.4;">
                保存ができたら、下のボタンから𝕏（Twitter）を開いて、<br>いま保存した画像を添付してポストできます！
            </p>
            
            <!-- X共有ボタン -->
            <a id="btnXPost" href="#" target="_blank" style="display: inline-block; padding: 10px 20px; font-size: 14px; background: #000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">𝕏 画像を添付してポストする</a>
        </div>
    </div>
    <hr style="border:0; height:1px; background:#cbd5e1; margin:30px 0;">
`;

// 📄 検索完了の直後に、裏側で画像を自動生成してセットする処理を呼び出す
setTimeout(() => {
    setupWordImageAndLink(word, no);
}, 50);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 関連キーワードをクリックしたときに再検索する用の関数
        function injectAndSearch(word) {
            document.getElementById("searchInput").value = word;
            searchWord();
        }

        // 初期表示
        loadMoreWords();
        loadMoreWords();
        loadMoreWords();

// 🖼️ 数字も単語も両方自動改行する画像作成処理
function drawCanvas(word, no) {
    const canvas = document.getElementById("wordCanvas");
    const ctx = canvas.getContext("2d");

    // 背景グラデーション
    const gradient = ctx.createLinearGradient(0, 0, 600, 315);
    gradient.addColorStop(0, '#eff6ff');
    gradient.addColorStop(1, '#dbeafe');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 600, 315);

    // 飾り枠線
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 8;
    ctx.strokeRect(20, 20, 560, 275);

    // タイトル
    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('📚 バベルの国語辞典(The Vocabulary Book of Babel)', 40, 55);

    const maxWidth = 520; // 左右の枠線を避けた最大横幅

    // ---------------------------------------------
    // 【対策】No.の数字部分を自動で改行して描画する
    // ---------------------------------------------
    const noText = 'No.' + no;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#3b82f6';

    const noLines = [];
    let currentNoLine = "";

    for (let i = 0; i < noText.length; i++) {
        const char = noText[i];
        const testLine = currentNoLine + char;
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && i > 0) {
            noLines.push(currentNoLine);
            currentNoLine = char;
        } else {
            currentNoLine = testLine;
        }
    }
    noLines.push(currentNoLine);

    // ---------------------------------------------
    // 【修正】数字の行数と単語の長さに合わせてサイズを大縮小する
    // ---------------------------------------------
    // 文字数が異常に多い場合は、最初からフォントを限界まで小さくする
    let wordFontSize = 50;
    if (word.length > 200) wordFontSize = 12; // 消失レベル
    else if (word.length > 50) wordFontSize = 18;
    else if (word.length > 10) wordFontSize = 32;

    ctx.font = `bold ${wordFontSize}px sans-serif`;
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top'; // 基準を「上端」に変えて重なりを防ぐ

    // 単語の改行ラインを計算
    let lines = [];
    let currentLine = "";

    for (let i = 0; i < word.length; i++) {
        const char = word[i];
        const testLine = currentLine + char;
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && i > 0) {
            lines.push(currentLine);
            currentLine = char;
        } else {
            currentLine = testLine;
        }
    }
    lines.push(currentLine);

    // 💡【修正】数字が多すぎる場合に限界まで小さくし、文字の折り返しを再計算する
    let noFontSize = 18;
    let noLineHeight = 22;

    // 数字の元の行数が長い場合、フォントサイズを限界まで小さくする
    if (noLines.length > 8) {
        noFontSize = 9;
        noLineHeight = 11;
    } else if (noLines.length > 3) {
        noFontSize = 13;
        noLineHeight = 16;
    }

    // 小さくなったフォントサイズに合わせて、数字の改行位置（noLines）を綺麗に再計算
    ctx.font = `bold ${noFontSize}px sans-serif`;
    const finalNoLines = [];
    let currentNoLineFinal = "";

    for (let i = 0; i < noText.length; i++) {
        const char = noText[i];
        const testLine = currentNoLineFinal + char;
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth > maxWidth && i > 0) {
            finalNoLines.push(currentNoLineFinal);
            currentNoLineFinal = char;
        } else {
            currentNoLineFinal = testLine;
        }
    }
    finalNoLines.push(currentNoLineFinal);

    // --- ここから実際の描画処理 ---
    
    // 1. 数字を上から描画
    ctx.font = `bold ${noFontSize}px sans-serif`;
    ctx.fillStyle = '#3b82f6';
    ctx.textAlign = 'left';
    finalNoLines.forEach((line, index) => {
        ctx.fillText(line, 40, 80 + (index * noLineHeight));
    });

    // 2. 数字が「描き終わった位置（Y座標）」を正確に計算する
    let noBottomY = 80 + (finalNoLines.length * noLineHeight) + 15;

    // 3. 残りの全スペース（枠の下端275pxまで）に単語が収まるよう、さらにフォントサイズを自動調整
    let lineHeight = wordFontSize * 1.3;
    while (noBottomY + (lines.length * lineHeight) > 280 && wordFontSize > 10) {
        wordFontSize--;
        lineHeight = wordFontSize * 1.3;
    }

    // 💡【修正】通常時は中央配置、数字が長くてぶつかる時だけ下にズラす計算
    const totalWordHeight = lines.length * lineHeight; // 単語全体の縦幅
    let wordStartY = 165 - (totalWordHeight / 2);      // 画像の縦中心（165px）を基準にする

    // もし中央に置くと数字と被る（または近すぎる）場合は、数字のすぐ下に押し下げる
    if (wordStartY < noBottomY) {
        wordStartY = noBottomY;
    }

    // 4. 単語を計算した位置から順番に描画する
    ctx.font = `bold ${wordFontSize}px sans-serif`;
    ctx.fillStyle = '#1e293b';
    ctx.textAlign = 'center';
    
    lines.forEach((line, index) => {
        ctx.fillText(line, 300, wordStartY + (index * lineHeight));
    });

    return canvas.toDataURL("image/png");
}
        
// 検索時に自動で画像をセットし、Xのリンクを作成しておく関数
function setupWordImageAndLink(word, no) {
    // 1. 画像を作成してimgタグに反映
    const imgUrl = drawCanvas(word, no);
    const outputImg = document.getElementById("outputImage");
    if (outputImg) outputImg.src = imgUrl;

    // 2. ✨ 追加：ダウンロードボタンの設定（ファイル名を「No.◯◯_単語.png」にする）
    const btnDownload = document.getElementById("btnDownload");
    if (btnDownload) {
        btnDownload.href = imgUrl;
        btnDownload.download = `No.${no}_${word}.png`; // ここでファイル名を指定しています！
    }

    // 3. X（Twitter）用のリンクを作成してボタンに仕込んでおく
    const tweetText = `バベルの国語辞典で「No.${no} ${word}」を調べました！\n#バベルの国語辞典\n`;
    const siteUrl = window.location.href;
    const xUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(tweetText)}&url=${encodeURIComponent(siteUrl)}`;
    
    const btnXPost = document.getElementById("btnXPost");
    if (btnXPost) btnXPost.href = xUrl;
}
    </script>
</body>
</html>
