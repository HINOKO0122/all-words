<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全言葉辞典</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f6f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        .search-box { position: sticky; top: 0; background: #f4f6f9; padding: 15px 0; border-bottom: 2px solid #e2e8f0; z-index: 100; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { padding: 12px 20px; font-size: 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .word-list { margin-top: 20px; }
        .word-item { padding: 15px; background: white; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid #cbd5e1; }
        .word-item.highlight { background: #eff6ff; border-left-color: #3b82f6; }
        .no { font-weight: bold; color: #3b82f6; font-size: 14px; }
        .word { font-size: 24px; display: block; margin: 8px 0; font-weight: bold; letter-spacing: 1px; }
        .btn-dict { display: inline-block; margin-top: 8px; padding: 6px 12px; font-size: 12px; background: #10b981; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-dict:hover { background: #059669; }
    </style>
</head>
<body>

    <h1>📚 全言葉辞典</h1>
    <div class="subtitle">すべてのひらがなの組み合わせを網羅したアーカイブ</br>あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎー)</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="単語（例: あい）または 番号（例: 500）を入力">
        <button onclick="searchWord()">検索</button>
    </div>

    <div id="targetWordArea"></div>
    <h2 style="font-size: 18px; color: #475569; margin-top: 30px;">辞典一覧（No.1 〜 No.6806 ーー まで常時表示）</h2>
    <div class="word-list" id="wordList"></div>

    <script>
        const CHARS = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎー";
        const BASE = BigInt(CHARS.length);

        let currentLoadedCount = 0;
        const LOAD_CHUNK = 50; 
        const maxDisplayCount = 6806; // 「ーー」までの語数

        // ナンバーから言葉を作る
        function getWordFromNo(no) {
            let n = BigInt(no) - 1n;
            let word = "";
            let len = 1n;
            let range = BASE;

            while (n >= range) {
                n -= range;
                len++;
                range *= BASE;
            }

            for (let i = 0; i < len; i++) {
                word = CHARS[Number(n % BASE)] + word;
                n /= BASE;
            }
            return word;
        }

        // 言葉からナンバーを作る
        function getNoFromWord(word) {
            let no = 0n;
            let len = BigInt(word.length);
            let range = 1n;

            for (let i = 1n; i < len; i++) {
                range *= BASE;
                no += range;
            }

            let current = 0n;
            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                const index = CHARS.indexOf(char);
                if (index === -1) return -1n;
                current = current * BASE + BigInt(index);
            }
            return no + current + 1n;
        }

        // 入力された文字を含む、意味のある日本語の候補を簡易的に生成する機能
        function getMeaningfulWords(keyword) {
            // 代表的な日本語の接尾語や、よくある言葉の組み合わせパターン
            const templates = ["言葉", "辞典", "日記", "未来", "世界", "科学", "自然", "人間", "学校", "時間", "自由", "平和"];
            const results = [];
            
            // 1. その言葉そのもの
            results.push(keyword);
            // 2. 前後に一般的な言葉をくっつけて「意味のある言葉の組み合わせ」をシミュレート
            results.push(keyword + "する");
            results.push(keyword + "の謎");
            
            if(keyword.length <= 2) {
                templates.slice(0, 4).forEach(t => {
                    results.push(keyword + t);
                    results.push(t + keyword);
                });
            }
            return [...new Set(results)]; // 重複削除
        }

        // 一覧表示（無限スクロール）
        function loadMoreWords() {
            if (currentLoadedCount >= maxDisplayCount) return;

            const listContainer = document.getElementById("wordList");
            let html = "";
            
            const start = currentLoadedCount + 1;
            const end = Math.min(maxDisplayCount, currentLoadedCount + LOAD_CHUNK);

            for (let i = start; i <= end; i++) {
                const word = getWordFromNo(i);
                html += `
                    <div class="word-item" id="word-${word}">
                        <span class="no">No.${i}</span>
                        <span class="word">${word}</span>
                        <a class="btn-dict" href="https://www.google.com/search?q=${encodeURIComponent(word)}+意味" target="_blank">🔍 この言葉の意味を検索</a>
                    </div>
                `;
            }
            
            listContainer.insertAdjacentHTML('beforeend', html);
            currentLoadedCount = end;
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                loadMoreWords();
            }
        });

        // 検索＆ワープ処理
        function searchWord() {
            const input = document.getElementById("searchInput").value.trim();
            if (!input) return;

            let no = 0n;
            let word = "";

            // 数字か文字かを判定
            if (/^\d+$/.test(input)) {
                // 数字（No）で検索された場合
                no = BigInt(input);
                word = getWordFromNo(no);
            } else {
                // 文字（単語）で検索された場合
                word = input;
                no = getNoFromWord(word);
                if (no === -1n) {
                    alert("辞典に含まれない文字（漢字、カタカナ、アルファベット等）が含まれています。ひらがな・濁音・半濁音・小文字・ー のみで入力してください。");
                    return;
                }
            }

            // 「その言葉が含まれていて、意味のある言葉」のリストを生成
            const meaningfulList = getMeaningfulWords(word);
            let relatedHtml = "";
            
            meaningfulList.forEach(w => {
                const wNo = getNoFromWord(w);
                if (wNo !== -1n) {
                    relatedHtml += `<a href="#" class="related-tag" onclick="injectAndSearch('${w}'); return false;">${w} (No.${wNo})</a>`;
                } else {
                    // 漢字などが混ざったリアルな言葉はGoogleへの直接リンクにする
                    relatedHtml += `<a href="https://www.google.com/search?q=${encodeURIComponent(w)}+意味" target="_blank" class="related-tag" style="background:#e0f2fe;">${w} ↗</a>`;
                }
            });

            const targetArea = document.getElementById("targetWordArea");
            targetArea.innerHTML = `
                <h2 style="font-size: 18px; color: #3b82f6; margin-top: 20px;">🔍 検索結果へワープしました</h2>
                <div class="word-item highlight">
                    <span class="no">No.${no}</span>
                    <span class="word">${word}</span>
                    <a class="btn-dict" href="https://www.google.com/search?q=${encodeURIComponent(word)}+意味" target="_blank">🔍 Googleで「${word}」の意味を調べる</a>
                    <a class="btn-dict" href="https://dictionary.goo.ne.jp/srch/all/${encodeURIComponent(word)}/m0u/" target="_blank" style="background:#ea580c;">📖 goo辞書で調べる</a>
                    
                    <div class="related-section">
                        <div class="related-title">💡 「${word}」が含まれる・関連する言葉の例:</div>
                        <div class="related-tags">
                            ${relatedHtml}
                        </div>
                    </div>
                </div>
                <hr style="border:0; height:1px; background:#cbd5e1; margin:30px 0;">
            `;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 関連キーワードをクリックしたときに再検索する用の関数
        function injectAndSearch(word) {
            document.getElementById("searchInput").value = word;
            searchWord();
        }

        // 初期表示
        loadMoreWords();
        loadMoreWords();
        loadMoreWords();
    </script>
</body>
</html>
